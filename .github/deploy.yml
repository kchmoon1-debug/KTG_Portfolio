name: Java CI/CD with Gradle & EC2 Deployment

# main 브랜치에 코드가 push될 때 이 작업이 실행됩니다.
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소의 최신 코드를 불러옵니다.
      - uses: actions/checkout@v3

      # 2. 빌드를 위해 자바 17 환경을 준비합니다.
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. AWS EC2 서버에 SSH로 접속하여 최신 코드를 받고 실행합니다.
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            cd ~/KTG_Portfolio
            git pull origin main
            chmod +x gradlew
            ./gradlew clean build
            pkill -f java || true
            nohup java -jar build/libs/Portfolio-0.0.1-SNAPSHOT.jar > nohup.out 2>&1 &