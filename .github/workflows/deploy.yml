name: Java CI/CD with Gradle & EC2 Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            cd ~/KTG_Portfolio
            git pull origin main
            chmod +x gradlew
            ./gradlew clean build -x test --no-daemon -Dorg.gradle.jvmargs="-Xmx256m"
            fuser -k 8080/tcp || pkill -9 -f java || true
            sleep 2
            nohup java -Xms128m -Xmx256m -jar build/libs/*.jar > /dev/null 2>&1 &
            disown